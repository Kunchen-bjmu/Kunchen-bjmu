<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#074C83"/>
      <stop offset="0.55" stop-color="#2A6B96"/>
      <stop offset="1" stop-color="#5B93B8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#dots)"/>
  <circle cx="1180" cy="40" r="220" fill="url(#fade)"/>

  <!-- top rule -->
  <rect x="0" y="0" width="1280" height="6" fill="#AFC7D9"/>

  <!-- label -->
  <g font-family="Helvetica Neue, Arial, PingFang SC, sans-serif">
    <text x="72" y="72" fill="#BFD4E6" font-size="15" letter-spacing="6" font-weight="600">GITHUB PROFILE</text>

    <!-- name -->
    <text x="72" y="152" fill="#FFFFFF" font-size="52" font-weight="700" letter-spacing="1">YOUR NAME</text>
    <text x="72" y="192" fill="#DCE9F2" font-size="26" letter-spacing="8">你的名字 / 拼音</text>

    <!-- subtitle -->
    <text x="72" y="240" fill="#EAF2F8" font-size="19" letter-spacing="1.5">Clinical Medicine · Medical Research · Data Analysis</text>
    <text x="72" y="268" fill="#BFD4E6" font-size="16" letter-spacing="1">临床医学 · 医学科研 · 数据分析</text>
  </g>

  <!-- ECG motif -->
  <g transform="translate(760 118)" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 40 H96 l16 -34 l18 76 l20 -60 l16 26 l24 -8 H460"/>
  </g>
  <g transform="translate(760 118)" fill="#FFFFFF">
    <circle cx="96" cy="40" r="4.5" fill-opacity="0.9"/>
    <circle cx="150" cy="62" r="4.5" fill-opacity="0.9"/>
    <circle cx="460" cy="40" r="6" fill-opacity="0.95"/>
  </g>

  <!-- data bars -->
  <g transform="translate(760 250)" fill="#FFFFFF" fill-opacity="0.35">
    <rect x="0" y="-1" width="8" height="10" rx="2"/>
    <rect x="16" y="-7" width="8" height="16" rx="2"/>
    <rect x="32" y="-14" width="8" height="23" rx="2"/>
    <rect x="48" y="-4" width="8" height="13" rx="2"/>
    <rect x="64" y="-20" width="8" height="29" rx="2"/>
    <rect x="80" y="-10" width="8" height="19" rx="2"/>
    <rect x="96" y="-24" width="8" height="33" rx="2"/>
    <rect x="112" y="-13" width="8" height="22" rx="2"/>
  </g>
  <text x="760" y="286" fill="#BFD4E6" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="2">EVIDENCE · MODEL · INSIGHT</text>
</svg>
